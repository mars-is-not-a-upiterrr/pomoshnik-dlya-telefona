<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2457d6">
  <meta name="description" content="Простые пошаговые инструкции для телефона и телевизора">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>Помощник для телефона</title>
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <button id="homeButton" class="home-button" type="button" aria-label="На главную">⌂</button>
    <div class="brand">Помощник для телефона</div>
  </header>
  <main id="app" class="app" aria-live="polite">
    <p class="loading">Загружаем инструкции…</p>
  </main>
  <footer class="footer">Если что-то не получается — можно вернуться на главную.</footer>
  <script>
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
